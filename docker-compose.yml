services:
  app:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-debopriyobasu-site}-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true